<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Primavera & Lanzamiento EP!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo animado para pétalos cayendo/flotando -->
  <canvas id="canvas-petals"></canvas>

  <!-- Tarjeta Principal -->
  <main class="card">
    <div class="header">
      <span class="badge">21 de Septiembre</span>
      <h1>Primavera 🌻 / Otoño 🍂</h1>
      <p class="subtitle">Primavera allá, otoño acá, pero la música sale igual.</p>
    </div>

    <!-- Cuenta Regresiva -->
    <div class="countdown-container">
      <div class="timer-box">
        <span id="days">00</span>
        <small>Días</small>
      </div>
      <div class="timer-box">
        <span id="hours">00</span>
        <small>Hs</small>
      </div>
      <div class="timer-box">
        <span id="minutes">00</span>
        <small>Min</small>
      </div>
      <div class="timer-box">
        <span id="seconds">00</span>
        <small>Seg</small>
      </div>
    </div>

    <!-- Animación del Girasol -->
    <div class="sunflower-container">
      <div class="sunflower">
        <div class="flower-center"></div>
        <div class="petals" id="petals"></div>
      </div>
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
    </div>

    <!-- Sección del Lanzamiento del EP -->
    <section class="ep-release">
      <h2>Mi primer EP</h2>
      <p id="release-text">Estuve armando estos temas hace tiempo y hoy por fin salen a la luz. Vayan a escucharlos y disfruten o simplemente tiren hate :)</p>
      
      <a href="https://open.spotify.com/album/5CwFKggVaKTUqK1P8tBMvN" target="_blank" rel="noopener noreferrer" class="btn-listen">
        <svg class="icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        Escuchar ahora
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
